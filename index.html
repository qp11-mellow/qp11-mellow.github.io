<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>猜拳游戏 — Rock Paper Scissors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #2d2d44;
      border-radius: 20px;
      padding: 40px 50px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 550px;
      width: 100%;
    }

    h1 { color: #f0e6d3; font-size: 32px; margin-bottom: 8px; letter-spacing: 2px; }

    .subtitle { color: #8888aa; font-size: 14px; margin-bottom: 25px; }

    /* 比分板 */
    .scoreboard {
      display: flex;
      justify-content: space-between;
      background: #1e1e30;
      border-radius: 12px;
      padding: 15px 25px;
      margin-bottom: 25px;
    }

    .score-item { text-align: center; flex: 1; }

    .score-label {
      color: #aaaacc;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score-value {
      color: #f0e6d3;
      font-size: 36px;
      font-weight: bold;
      display: inline-block;
    }

    .score-value.human    { color: #4fc3f7; }
    .score-value.computer { color: #ef5350; }
    .score-value.tie      { color: #ffd54f; }

    @keyframes bump {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    .score-value.bump { animation: bump .3s ease; }

    /* 选择展示区 */
    .choices-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding: 20px 0;
    }

    .choice-box { text-align: center; flex: 1; }

    .choice-emoji { font-size: 64px; display: block; margin-bottom: 8px; }

    @keyframes pop {
      0%   { transform: scale(.5) rotate(-12deg); opacity: .3; }
      60%  { transform: scale(1.18) rotate(4deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .choice-emoji.pop { animation: pop .35s ease; }

    .choice-label { color: #aaaacc; font-size: 14px; }

    .vs { color: #666688; font-size: 24px; font-weight: bold; }

    /* 结果信息 */
    .result-message {
      background: #1e1e30;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 25px;
      color: #f0e6d3;
      font-size: 18px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s, border-color .2s;
    }

    .result-message.win  { color: #4fc3f7; border-color: #4fc3f733; }
    .result-message.lose { color: #ef5350; border-color: #ef535033; }
    .result-message.tie  { color: #ffd54f; border-color: #ffd54f33; }

    /* 按钮 */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .choice-btn {
      width: 100px;
      height: 100px;
      border: 2px solid transparent;
      border-radius: 16px;
      background: #3d3d5c;
      cursor: pointer;
      font-size: 42px;
      line-height: 1;
      transition: transform .25s ease, background .25s ease,
                  border-color .25s ease, box-shadow .25s ease, opacity .2s;
    }

    .choice-btn:hover:not(:disabled) {
      transform: translateY(-6px);
      background: #4d4d70;
      border-color: #8888bb;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .choice-btn:active:not(:disabled) { transform: translateY(0); }

    .choice-btn:focus-visible,
    .reset-btn:focus-visible { outline: 3px solid #4fc3f7; outline-offset: 3px; }

    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 重置按钮区域 */
    .reset-area { margin-top: 5px; }

    .reset-btn {
      background: transparent;
      border: 1px solid #555577;
      color: #aaaacc;
      padding: 8px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: #3d3d5c;
      color: #f0e6d3;
      border-color: #8888bb;
    }

    .round-info { color: #666688; font-size: 13px; margin-top: 12px; }

    @media (max-width: 480px) {
      .container { padding: 28px 20px; }
      h1 { font-size: 26px; }
      .choice-btn { width: 78px; height: 78px; font-size: 34px; }
      .choice-emoji { font-size: 52px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✊ 猜拳游戏</h1>
    <p class="subtitle">Rock · Paper · Scissors — 先得 3 分者获胜</p>

    <!-- 比分板 -->
    <div class="scoreboard">
      <div class="score-item">
        <div class="score-label">👤 你</div>
        <div class="score-value human" id="humanScore">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">🤝 平局</div>
        <div class="score-value tie" id="tieScore">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">🤖 电脑</div>
        <div class="score-value computer" id="computerScore">0</div>
      </div>
    </div>

    <!-- 选择展示 -->
    <div class="choices-display">
      <div class="choice-box">
        <span class="choice-emoji" id="humanEmoji">🧑</span>
        <div class="choice-label" id="humanChoiceLabel">你的选择</div>
      </div>
      <div class="vs">VS</div>
      <div class="choice-box">
        <span class="choice-emoji" id="computerEmoji">💻</span>
        <div class="choice-label" id="computerChoiceLabel">电脑选择</div>
      </div>
    </div>

    <!-- 结果 -->
    <div class="result-message" id="resultMessage" role="status" aria-live="polite">
      点击下方按钮开始游戏
    </div>

    <!-- 按钮 -->
    <div class="buttons">
      <button class="choice-btn" data-choice="rock"     aria-label="出石头">🪨</button>
      <button class="choice-btn" data-choice="paper"    aria-label="出布">📄</button>
      <button class="choice-btn" data-choice="scissors" aria-label="出剪刀">✂️</button>
    </div>

    <!-- 重置 -->
    <div class="reset-area">
      <button class="reset-btn" id="resetBtn">🔄 重新开始</button>
    </div>
    <div class="round-info" id="roundInfo">第 0 轮</div>
  </div>

  <script>
    'use strict';

    /* ---------- 配置 ---------- */
    const WIN_SCORE = 3;          // 改为 1 就是单局定胜负，改为 5 就是五胜制

    const EMOJI = { rock: '🪨', paper: '📄', scissors: '✂️' };
    const LABEL = { rock: '石头', paper: '布', scissors: '剪刀' };
    // BEATS[a] === b 表示 a 赢 b（规则集中在一处，方便扩展）
    const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

    /* ---------- 状态 ---------- */
    const state = { human: 0, computer: 0, tie: 0, round: 0, over: false };

    /* ---------- DOM ---------- */
    const el = {
      humanScore:        document.getElementById('humanScore'),
      computerScore:     document.getElementById('computerScore'),
      tieScore:          document.getElementById('tieScore'),
      humanEmoji:        document.getElementById('humanEmoji'),
      humanChoiceLabel:  document.getElementById('humanChoiceLabel'),
      computerEmoji:     document.getElementById('computerEmoji'),
      computerChoiceLabel: document.getElementById('computerChoiceLabel'),
      result:            document.getElementById('resultMessage'),
      roundInfo:         document.getElementById('roundInfo'),
      resetBtn:          document.getElementById('resetBtn'),
      buttons:           Array.from(document.querySelectorAll('.choice-btn')),
    };

    /* ---------- 工具 ---------- */
    // 移除类 -> 强制重排 -> 重新添加，让动画可以重复触发
    function replayAnimation(node, className) {
      node.classList.remove(className);
      void node.offsetWidth;
      node.classList.add(className);
    }

    function getComputerChoice() {
      const choices = Object.keys(EMOJI);
      return choices[Math.floor(Math.random() * choices.length)];
    }

    /* ---------- 渲染 ---------- */
    function renderScore() {
      el.humanScore.textContent    = state.human;
      el.computerScore.textContent = state.computer;
      el.tieScore.textContent      = state.tie;
      el.roundInfo.textContent     = `第 ${state.round} 轮`;
    }

    function setResult(text, type) {
      el.result.textContent = text;
      el.result.className = 'result-message' + (type ? ' ' + type : '');
    }

    function setButtonsDisabled(disabled) {
      el.buttons.forEach(btn => { btn.disabled = disabled; });
    }

    /* ---------- 游戏逻辑 ---------- */
    function playRound(human, computer) {
      state.round++;

      el.humanEmoji.textContent       = EMOJI[human];
      el.humanChoiceLabel.textContent = LABEL[human];
      el.computerEmoji.textContent       = EMOJI[computer];
      el.computerChoiceLabel.textContent = LABEL[computer];
      replayAnimation(el.humanEmoji, 'pop');
      replayAnimation(el.computerEmoji, 'pop');

      if (human === computer) {
        state.tie++;
        replayAnimation(el.tieScore, 'bump');
        setResult(`🤝 平局！双方都出了${LABEL[human]}`, 'tie');
      } else if (BEATS[human] === computer) {
        state.human++;
        replayAnimation(el.humanScore, 'bump');
        setResult(`🎉 你赢了！${LABEL[human]} 赢 ${LABEL[computer]}`, 'win');
      } else {
        state.computer++;
        replayAnimation(el.computerScore, 'bump');
        setResult(`😵 你输了！${LABEL[computer]} 赢 ${LABEL[human]}`, 'lose');
      }

      renderScore();
    }

    function checkGameEnd() {
      if (state.human >= WIN_SCORE) {
        state.over = true;
        setResult(`🏆 你赢得了整场比赛！恭喜！（${state.human} : ${state.computer}）`, 'win');
      } else if (state.computer >= WIN_SCORE) {
        state.over = true;
        setResult(`💀 电脑赢得了整场比赛！再接再厉！（${state.human} : ${state.computer}）`, 'lose');
      }
      if (state.over) setButtonsDisabled(true);
    }

    function handleChoice(choice) {
      if (state.over || !EMOJI[choice]) return;
      playRound(choice, getComputerChoice());
      checkGameEnd();
    }

    function resetGame() {
      Object.assign(state, { human: 0, computer: 0, tie: 0, round: 0, over: false });

      el.humanEmoji.textContent          = '🧑';
      el.humanChoiceLabel.textContent    = '你的选择';
      el.computerEmoji.textContent       = '💻';
      el.computerChoiceLabel.textContent = '电脑选择';
      el.humanEmoji.classList.remove('pop');
      el.computerEmoji.classList.remove('pop');

      setResult('点击下方按钮开始游戏');
      renderScore();
      setButtonsDisabled(false);
    }

    /* ---------- 事件绑定 ---------- */
    el.buttons.forEach(btn => {
      btn.addEventListener('click', () => handleChoice(btn.dataset.choice));
    });

    el.resetBtn.addEventListener('click', resetGame);

    // 键盘快捷键：1/2/3 或 R/P/S 出拳；游戏结束后按 Enter 重开
    const KEY_MAP = {
      '1': 'rock',    '2': 'paper',    '3': 'scissors',
      'r': 'rock',    'p': 'paper',    's': 'scissors',
    };

    document.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (e.key === 'Enter' && state.over) {
        e.preventDefault();
        resetGame();
        return;
      }

      const choice = KEY_MAP[e.key.toLowerCase()];
      if (choice) {
        e.preventDefault();
        handleChoice(choice);
      }
    });

    /* ---------- 初始化 ---------- */
    renderScore();
  </script>
</body>
</html>
